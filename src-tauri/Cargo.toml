[package]
name = "flume-app"
version = "1.5.0"
description = "A beautiful, cross-platform BitTorrent client."
authors = ["Adam Greenwell"]
license = "Apache-2.0"
repository = "https://github.com/adamgreenwell/flume"
edition = "2024"
# Minimum supported Rust version.
#
# librqbit 9 needs 1.85+ (edition 2024), but a higher floor is required
# deliberately: cargo's MSRV-aware resolver will not select a dependency
# version whose rust-version exceeds ours, so an MSRV we do not actually need
# costs us updates. 1.85 silently held back the patched `time` (>= 0.3.47) and
# `plist` (1.10) releases that fix RUSTSEC-2026-0009, -0194 and -0195, which
# is why this is 1.88 and not lower.
#
# 1.90 because the Tauri 2.12 line declares it, and 1.88 held that line back
# while the `@tauri-apps/*` packages moved on -- which `tauri build` refuses
# outright, so every release build failed on a version mismatch that no local
# check could see. The second time this floor has cost something real; see
# `scripts/check-tauri-parity.mjs` for the guard.
rust-version = "1.90"

[lib]
name = "flume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# `tray-icon` gates `tauri::tray`; without it the tray module does not exist.
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-log = "2.10.1"

# --- Torrent engine -------------------------------------------------------
# `default-features = false` drops two defaults we do not want:
#   * `default-tls`      -> reqwest/native-tls -> OpenSSL. Linking against the
#                           host OpenSSL makes `.deb`/`.rpm` builds depend on a
#                           matching libssl at runtime, which is exactly the
#                           portability trap we are trying to avoid.
#   * `http-api-client`  -> a client for talking to a *remote* rqbit instance.
#                           Flume embeds the engine in-process, so this is dead
#                           weight and extra attack surface.
# `rust-tls` swaps in rustls (pure Rust, no system TLS) and the ring-backed
# SHA-1 implementation, so a Linux build has no OpenSSL dependency at all.
librqbit = { version = "9.0.0", default-features = false, features = ["rust-tls"] }

tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
log = "0.4"
directories = "6.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-notification = "2.7.0"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }

# --- Egress check ---------------------------------------------------------
# Maps the source address of the default route back to the interface that owns
# it, so `egress` can say which interface traffic actually leaves by rather
# than guessing from interface names -- see the module docs for why the
# difference is load-bearing. Already in `Cargo.lock` via
# librqbit-dualstack-sockets and librqbit-upnp, so declaring it directly adds
# no new crates to the tree.
#
# No `serde` feature: `egress` defines its own IPC types rather than putting a
# third-party struct on the wire, for the same reason `engine::status` does.
network-interface = { version = "2.0.5", default-features = false }

# --- Diagnostics and usage reporting --------------------------------------
# Every crate here is already in `Cargo.lock` transitively via librqbit, so
# declaring them directly adds no new crates to the tree.
#
# `reqwest` must keep `default-features = false`: the defaults pull
# `native-tls` -> OpenSSL, which is the same portability trap the librqbit
# comment above is avoiding. The feature is `rustls` in reqwest 0.13 (it was
# `rustls-tls` in 0.12), and it matches the stack librqbit's `rust-tls` already
# pulls in, so the binary carries one TLS implementation rather than two.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
# Redaction is the whole point of the diagnostics bundle; hand-rolled scanning
# for URLs, addresses and hashes is exactly the thing to get subtly wrong.
regex = "1.13"
rand = "0.10"
# `zip` off, and only `zip`. It extracts the v1 updater formats -- zipped
# Windows installers and the compressed `.AppImage.tar.gz` -- which Flume never
# builds: `createUpdaterArtifacts: true` (v2) signs the .msi, .exe and AppImage
# as they are, and macOS's .app.tar.gz uses tar/flate2, which are not behind
# this feature on macOS. Left on, it pulled zip 4.6.1, whose extraction has
# three advisories (RUSTSEC-2026-0367/0368/0369: SUID bits, and two symlink
# escapes) -- in the one code path whose whole job is extracting downloads.
# `system-proxy` stays: docs/Privacy.md says a check follows the OS proxy.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }

[features]
default = []

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
# Flume's engine layer runs on a live network; these lints catch the classes of
# mistake that would surface as a hang or a panic in front of the user.
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }

# librqbit does not expose per-peer piece availability, so a swarm cannot be
# told "everyone stalled at 6%" from "these six hold every piece between them".
# The data is tracked for piece picking but not serialised; asked upstream in
# ikatson/rqbit#643 and carried here until that lands.
#
# Pinned to a rev rather than a branch so a build is reproducible. Drop this
# whole section once the change is in a crates.io release.
[patch.crates-io]
librqbit = { git = "https://github.com/adamgreenwell/rqbit.git", rev = "b512d98c" }
