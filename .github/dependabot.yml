version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Tauri's crates are versioned together; a split upgrade usually fails to
      # compile, so batch them into one PR.
      tauri:
        patterns: ["tauri", "tauri-build", "tauri-plugin-*"]
    ignore:
      # rust-ini 0.21.2 added two fields to the public `ParseOption` struct,
      # which is not `#[non_exhaustive]` -- so every struct literal of it
      # stopped compiling, in a patch release. `tauri-plugin-deep-link` builds
      # one at src/lib.rs:539 setting exactly `enabled_quote` and
      # `enabled_escape`, so the Linux build fails with E0063.
      #
      # Held at 0.21.1 in Cargo.lock, the last version whose `ParseOption` has
      # exactly those two fields. We do not depend on rust-ini ourselves and
      # there is nothing to bump; the entry exists so a weekly lockfile bump
      # cannot quietly move it forward again. `cargo audit` is clean at 0.21.1,
      # so this costs no advisory fix.
      #
      # Only visible on Linux: deep-link's ini use is behind
      # `cfg(target_os = "linux")`, so a macOS build and a macOS `cargo
      # clippy` both pass. CI is the only thing that sees it.
      #
      # Drop this the moment deep-link stops using a struct literal, or
      # rust-ini yanks 0.21.3.
      - dependency-name: rust-ini

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      next:
        patterns:
          ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tauri:
        patterns: ["@tauri-apps/*"]
      dev-tooling:
        patterns:
          [
            "vitest",
            "@vitejs/*",
            "@testing-library/*",
            "prettier*",
            "eslint*",
            "typescript",
            "jsdom",
          ]
    ignore:
      # CLAUDE.md records the decision to stay on TypeScript 5.x, but the
      # ignore that was supposed to enforce it was never written -- so #76
      # proposed TS 7 anyway and took the whole dev-tooling group down with it.
      #
      # typescript-eslint 8.x declares `typescript ">=4.8.4 <6.1.0"`, so on 7
      # `npm run lint` cannot run at all. It is the group, not the bump, that
      # makes this expensive: one blocked major holds back vitest, prettier and
      # the testing-library updates alongside it.
      #
      # Revisit in #28, once typescript-eslint supports the native compiler.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 removed `context.getFilename()`, and the eslint-plugin-react
      # that eslint-config-next vendors still calls it:
      #
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      #
      # eslint-config-next declares `eslint: ^8.57.0 || ^9.0.0 || ^10.0.0`, so
      # the range says this is supported and the bundled plugin says otherwise.
      # Believe the stack trace. Lift this when a next release ships a plugin
      # that runs on 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
