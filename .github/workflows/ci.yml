name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug symbols are dead weight in CI and cost significant cache space.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint-test:
    name: Lint & test
    # ubuntu-22.04 pinned deliberately: it is the oldest supported Linux base
    # and therefore sets the glibc/WebKitGTK floor for our .deb builds.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v7
        with:
          # Matches the Node the project is developed on and the @types/node
          # major. Node here is build tooling only -- it is never shipped to
          # users, who get a native binary -- so tracking the dev environment
          # is worth more than tracking LTS, and removes a class of
          # "works locally, fails in CI" drift.
          node-version: 26
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # --- Frontend -------------------------------------------------------
      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test

      - name: Next.js static export
        run: npm run build

      - name: Verify the export produced static output
        run: |
          test -f out/index.html || { echo "::error::static export missing out/index.html"; exit 1; }
          if find out -name "*.js" -newer out/index.html | xargs -r grep -l "next/dist/server" 2>/dev/null | head -1 | grep -q .; then
            echo "::error::server runtime code leaked into the static export"; exit 1
          fi

      # --- Backend --------------------------------------------------------
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  audit:
    name: Security audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Node the project is developed on and the @types/node
          # major. Node here is build tooling only -- it is never shipped to
          # users, who get a native binary -- so tracking the dev environment
          # is worth more than tracking LTS, and removes a class of
          # "works locally, fails in CI" drift.
          node-version: 26
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - run: npm ci

      - name: npm audit
        run: npm audit --omit=dev
