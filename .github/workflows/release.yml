name: Release

# Tagging v* builds installers for every supported platform and attaches them
# to a draft GitHub Release. Draft rather than published: artifacts should be
# smoke-tested on each OS before anyone downloads them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Shared by both build steps below, so they cannot drift apart.
  RELEASE_BODY: |
    Download the file for your platform below.

    macOS builds are signed and notarized by Apple, so they open normally.

    **Windows builds are not signed.** SmartScreen will show "Windows protected
    your PC". The Run anyway button is behind **More info**, which is easy to
    miss. Linux packages have no such gate.

    `SHA256SUMS.txt` below covers every file here, if you would rather verify
    the download than trust the dialog:

        sha256sum -c SHA256SUMS.txt --ignore-missing

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      # The `secrets` context is not available in a step-level `if`, so the
      # presence check is hoisted to a job-level env var and tested from there.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # Same hoisting, for the updater's minisign key (#176). Absent, the build
      # is exactly what it was before the updater existed: no updater
      # artifacts, no latest.json, and an app whose empty `pubkey` keeps it
      # from checking. Forks and re-runs without the secret stay green.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      # One platform failing should not discard artifacts that already built:
      # a partial release is still useful, and re-running one leg is cheap.
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two single-architecture builds.
          # macOS runners bill at 10x and were roughly two thirds of a release
          # run's cost; collapsing two jobs into one removes a whole job's
          # checkout, npm ci, and toolchain setup at that multiplier.
          #
          # Users also get one download instead of having to know which Mac
          # they own. The .dmg is about twice the size (17 MB rather than 9),
          # which is a fair trade for a desktop app.
          #
          # `app` as well as `dmg`: the updater archive (.app.tar.gz) is made
          # from the `app` bundle, and a dmg-only build produces none. Without
          # the updater key no archive is made either way, so this changes
          # nothing until the key exists.
          - name: macOS (universal)
            runner: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin --bundles app,dmg"
          - name: Windows (x64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # GitHub's arm64 Windows runner. Native rather than cross-compiled:
          # Tauri's Windows bundlers (WiX and NSIS) expect to run on the target
          # architecture, so cross-building produces a binary with no installer.
          - name: Windows (arm64)
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: ""
          # ubuntu-22.04 deliberately: it is the oldest supported base and so
          # sets the glibc and WebKitGTK floor for the .deb. Building on a
          # newer runner produces a package that will not install on Debian 12.
          # arm64 Linux builds natively on GitHub's arm64 runner. Cross-
          # compiling would need an aarch64 sysroot with WebKitGTK in it, which
          # is far more fragile than using the right machine.
          - name: Linux arm64 (.deb / AppImage)
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--bundles deb,appimage"
          - name: Linux (.deb / AppImage)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # Restricted explicitly. Left unrestricted the bundler also emits
            # an .rpm here, but one built on Ubuntu carries Debian-derived
            # dependency metadata, so it is not the package a Fedora or RHEL
            # user should install. The dedicated Fedora job below produces the
            # real one; without this the two race to attach the same filename.
            args: "--bundles deb,appimage"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          # Tauri v2's documented Linux prerequisites, plus two the docs omit.
          # libayatana-* is the current name; libappindicator3-dev is only a
          # transitional package, and it is what the tray needs on Linux.
          # patchelf is required by the AppImage bundler.
          #
          # xdg-utils provides xdg-mime, which the AppImage bundler shells out
          # to. It is preinstalled on the x86_64 runner image but *not* on the
          # arm64 one, so the arm64 leg failed with:
          #   failed to bundle project: xdg-mime binary not found
          # desktop-file-utils is installed alongside it for the same reason --
          # linuxdeploy validates .desktop files, and the arm64 image cannot be
          # assumed to carry the same tools as the x86_64 one.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            xdg-utils \
            desktop-file-utils

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin is not a real rustup target -- it is a lipo
          # of two builds -- so the two underlying targets must be installed
          # for that leg instead.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      # The step above installs targets into *stable*, and `rust-toolchain.toml`
      # pins this repo to 1.98.0 -- so cargo runs a toolchain that does not have
      # them, and the universal build fails at the lipo step after a six-minute
      # compile with "Target x86_64-apple-darwin is not installed".
      #
      # Only this leg is affected. Every other one builds for its own host,
      # where the target is always present; macOS universal is the only leg
      # that cross-compiles. Run inside the checkout so the pin selects the
      # toolchain the targets land on.
      - name: Add the universal targets to the pinned toolchain
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Deliberately no Rust build cache on release runs. A cached target
      # directory built with different features is exactly the state that
      # triggers the proc-macro resolution failure in #22, and a release build
      # is not worth risking for a few minutes of compile time.
      - run: npm ci

      # `usage::sender::ENDPOINT` is `option_env!("FLUME_USAGE_ENDPOINT")`, which
      # distinguishes unset from empty. Unset compiles reporting inert. Empty
      # compiles `Some("")` -- configured, pointed at nowhere, and silent about
      # it, which is the exact failure `should_warn` exists to make impossible.
      #
      # So this cannot be `env: FLUME_USAGE_ENDPOINT: ${{ secrets.* }}` on the
      # build step: a missing secret expands to an empty string, not to nothing.
      # Same trap as the APPLE_* variables below, and the same rule -- when
      # there is no value, the variable must be absent entirely. Exporting
      # through $GITHUB_ENV is how a variable gets to be absent conditionally.
      #
      # A malformed value fails the build rather than shipping. An endpoint that
      # is present but wrong is worse than none: reporting reads as configured,
      # the warning never fires, and events queue forever against a URL that was
      # never going to work.
      - name: Bake in the collector endpoint, if one is configured
        shell: bash
        env:
          ENDPOINT: ${{ secrets.FLUME_USAGE_ENDPOINT }}
        run: |
          if [ -z "${ENDPOINT:-}" ]; then
            echo "No FLUME_USAGE_ENDPOINT secret configured."
            echo "Usage reporting compiles inert: this build cannot send anything,"
            echo "even if a user opts in. That is the correct result for a fork."
            exit 0
          fi

          # Not echoed. Actions masks secrets in logs, so printing it would only
          # produce ***, and the shape is the whole point of the check.
          #
          # The rule lives in scripts/check-usage-endpoint.sh, shared with the
          # .rpm job below and pinned to `usage::sender::is_usable` by a test.
          # It used to be inline here and in the .rpm job as `https://?*`,
          # which accepted the documentation placeholder
          # `https://flume-usage.<your-subdomain>.workers.dev/v1/usage` -- and
          # every release from 1.0.x to 1.4.0 shipped with it.
          if ! bash scripts/check-usage-endpoint.sh; then
            echo "::error::FLUME_USAGE_ENDPOINT must be an https:// URL whose host is a real hostname -- not a placeholder."
            exit 1
          fi

          echo "FLUME_USAGE_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo "Collector endpoint configured."

      # Updater artifacts only when there is a key to sign them with. The CLI
      # refuses to make them unsigned, so turning them on unconditionally in
      # tauri.conf.json would break every build without the secret; that is
      # why src-tauri/tauri.updater.conf.json exists, holding only that switch
      # (JSON has no comments, so its explanation lives here). Merged
      # from a committed file rather than an inline JSON string: tauri-action
      # splits `args` on whitespace, and quoting JSON through that is fragile.
      # An absolute path, because the CLI changes into src-tauri/ partway.
      # Only in this repository. A fork that copies the workflow and sets its
      # own secret must not get the official-build marker below, or its builds
      # would check this repository's releases (Codex, #236).
      - name: Enable updater artifacts, if a key is configured
        if: env.HAS_UPDATER_KEY == 'true' && github.repository == 'adamgreenwell/flume'
        shell: bash
        run: |
          # The CLI signs everything and only then validates the public key,
          # so an empty one fails the build at the very end -- on every leg at
          # once, after the tag is pushed. Found by building locally with a
          # throwaway key: "failed to decode pubkey: Missing comment in public
          # key". Checked here instead, in seconds, before the macOS leg's 10x
          # minutes start. The secret without the public key is exactly the
          # state between adding one and merging the other.
          if ! node -e '
            const c = require("./src-tauri/tauri.conf.json");
            const key = (c.plugins && c.plugins.updater && c.plugins.updater.pubkey) || "";
            process.exit(key.trim() ? 0 : 1);
          '; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is set, but plugins.updater.pubkey in src-tauri/tauri.conf.json is empty. Paste the matching .pub key there first; see docs/CI-CD-and-Releases.md."
            exit 1
          fi
          echo "UPDATER_ARGS=--config ${GITHUB_WORKSPACE}/src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          # Compiled in by `updates::official_build`. The committed public key
          # alone is not enough to make a build check for updates, because
          # every fork inherits it; this marker is what only an official
          # release build carries.
          echo "FLUME_OFFICIAL_UPDATES=1" >> "$GITHUB_ENV"
          echo "Updater artifacts will be built; the updater-manifest job writes latest.json."

      # Two steps rather than one, because passing empty APPLE_* variables is
      # not the same as passing none. tauri-action treats the presence of
      # APPLE_CERTIFICATE as a request to sign and then fails importing an
      # empty certificate:
      #
      #   security: SecKeychainItemImport: ...parameters...were not valid
      #   failed codesign application: failed to import keychain certificate
      #
      # The application itself builds fine; only bundling fails. So when no
      # certificate is configured the variables must be absent entirely, which
      # is exactly the local unsigned build that works.
      - name: Build and bundle (signed)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Read by the CLI only when updater artifacts are on, so an empty
          # value for a fork is harmless -- unlike APPLE_CERTIFICATE above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Flume __VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          # Never per leg: five legs read-modify-writing one latest.json race
          # (Codex, #236). The `updater-manifest` job writes it once, after
          # all of them. The legs still upload each artifact and its .sig.
          uploadUpdaterJson: false
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}

      - name: Build and bundle (unsigned)
        if: env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Flume __VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}

  rpm:
    name: Linux ${{ matrix.arch }} (.rpm)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # Built in a Fedora container rather than on the runner: .rpm packaging
    # needs rpmbuild and Fedora's webkit2gtk4.1, neither of which exist on the
    # Ubuntu image.
    container:
      image: fedora:40
    steps:
      # No nodejs here: Fedora 40 ships Node 20, which is below the floor in
      # `engines`, so `npm ci` fails with EBADENGINE. setup-node below supplies
      # the right one and takes precedence on PATH.
      - name: Install build dependencies
        run: |
          dnf install -y \
            webkit2gtk4.1-devel openssl-devel curl wget file \
            libappindicator-gtk3-devel librsvg2-devel \
            gcc gcc-c++ make rpm-build git tar xz

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The container's own Node is too old. This is the same .nvmrc every
      # other job reads, so there is still one source of truth.
      #
      # No `cache: npm` unlike elsewhere: the cache action needs a resolvable
      # runner path, and this job's filesystem is the container's.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - run: node --version && npm ci

      - name: Build the frontend
        run: npm run build

      # The .rpm is attached to the same release as every other package, so it
      # gets the same endpoint. Without this, one Linux package out of three
      # would ship with reporting inert for no reason a user could discover.
      #
      # See the identical step in the `build` job for why this is exported
      # through $GITHUB_ENV rather than set as step env: a missing secret
      # expands to an empty string, and `option_env!` reads that as configured.
      - name: Bake in the collector endpoint, if one is configured
        shell: bash
        env:
          ENDPOINT: ${{ secrets.FLUME_USAGE_ENDPOINT }}
        run: |
          if [ -z "${ENDPOINT:-}" ]; then
            echo "No FLUME_USAGE_ENDPOINT secret configured; reporting compiles inert."
            exit 0
          fi

          # Same gate as the build job, from the same script -- see there.
          if ! bash scripts/check-usage-endpoint.sh; then
            echo "::error::FLUME_USAGE_ENDPOINT must be an https:// URL whose host is a real hostname -- not a placeholder."
            exit 1
          fi

          echo "FLUME_USAGE_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo "Collector endpoint configured."

      # `cargo install tauri-cli` compiled the CLI from source inside the
      # container on every single release, before any of Flume's own code was
      # touched, and was reliably the leg that decided how long a release took.
      # binstall fetches the prebuilt binary instead. Tauri publishes one for
      # both targets this matrix builds -- `cargo-tauri-x86_64-unknown-linux-gnu`
      # and `cargo-tauri-aarch64-unknown-linux-gnu` -- so neither leg compiles
      # it any more.
      #
      # The other legs do not need this: `tauri-action` brings its own CLI, and
      # this job cannot use that action because it runs in a container.
      #
      # `version` is pinned as well as the action ref, and both are load-
      # bearing. The ref pins the install *script*; the script's default is
      # whatever cargo-binstall released most recently, so pinning the ref
      # alone would leave the binary this job actually runs floating. The two
      # have to be bumped together -- Dependabot moves the ref and will not
      # touch the input.
      - name: Install the Tauri CLI
        uses: cargo-bins/cargo-binstall@v1.26.1
        with:
          version: "1.25.3"

      - name: Bundle the .rpm
        working-directory: src-tauri
        # `--strategies crate-meta-data` is the point of the change, not a
        # detail of it, and it is an allowlist rather than a denylist on
        # purpose. binstall has three strategies and tries all three in turn:
        # the publisher's own artifacts, then QuickInstall, then compiling
        # from source.
        #
        # Compiling is what this change exists to stop -- left enabled it
        # would quietly restore the ten minutes and report nothing. But
        # QuickInstall is the one that matters more here: binstall's own
        # SUPPORT.md calls it "an unofficial repository of prebuilt
        # binaries", and this job signs and ships what it builds. A release
        # pipeline should not reach for a third party's build of its build
        # tool because the publisher's was briefly unreachable; it should
        # fail, and be re-run.
        #
        # Naming the one permitted strategy rather than disabling the two
        # unwanted ones also means a fourth strategy added upstream is
        # excluded by default instead of silently joining the chain. It takes
        # precedence over any `disabled-strategies` the crate sets, so the
        # crate cannot widen it either.
        #
        # `--version "^2"` is carried over unchanged, so the CLI still tracks
        # the same major as everywhere else. `--locked` is not: it tells
        # `cargo install` to build from the crate's own lockfile, and there is
        # no build here to lock.
        run: |
          cargo binstall --no-confirm --strategies crate-meta-data \
            tauri-cli --version "^2"
          cargo tauri build --bundles rpm

      # Kept for dispatch runs that build no release, and as a fallback if the
      # release upload below fails.
      - name: Upload the .rpm as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: flume-rpm-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  attach-rpms:
    name: Attach .rpm files to the release
    # `build` as well as `rpm`, because the release this uploads to does not
    # exist until a `build` job has made it -- `tauri-action` creates the draft.
    # With `needs: rpm` alone the two were a race, and 1.4.1 lost it: both .rpm
    # jobs finished at 19:55:46 and 19:56:22, this ran at 19:56:25 and failed in
    # seven seconds, and the first build job finished at 19:57:50. 1.4.0 passed
    # on timing rather than on anything guaranteeing the order.
    #
    # Losing it is expensive out of proportion to the upload: `checksums` needs
    # this job, so a skipped upload takes SHA256SUMS.txt with it, and the draft
    # is then missing both the Fedora packages and the only way to verify any
    # of the others.
    #
    # Waiting on all of `build` costs nothing -- the upload itself takes about
    # seven seconds -- and means a failed build skips this rather than
    # attaching .rpm files to a release nobody should be publishing.
    needs: [build, rpm]
    runs-on: ubuntu-latest
    steps:
      # The .rpm jobs run inside a Fedora container, which has no GitHub CLI --
      # `gh: command not found` is how rc.2 failed. Rather than install one more
      # package into the container, the upload happens here, on a normal runner
      # where gh is preinstalled. It also handles both architectures in one
      # place instead of duplicating the step per matrix leg.
      - uses: actions/download-artifact@v8
        with:
          pattern: flume-rpm-*
          merge-multiple: true
          path: rpms

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la rpms/
          # --clobber so a re-run replaces assets rather than failing on a name
          # collision.
          gh release upload "$TAG" rpms/*.rpm --clobber -R "$GITHUB_REPOSITORY"

  updater-manifest:
    name: Updater manifest (latest.json)
    # Once, after every build leg -- never per leg, where tauri-action's
    # read-merge-delete-upload of one shared asset races across the matrix and
    # can publish a manifest missing platforms. `needs: build` also means a
    # release that lost a leg publishes no manifest at all; the script refuses
    # an incomplete one as well. Logic and tests: scripts/updater-manifest.mjs.
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && github.repository == 'adamgreenwell/flume' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_UPDATER_KEY == 'true'
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        if: env.HAS_UPDATER_KEY == 'true'
        with:
          node-version-file: .nvmrc
      - name: Build and upload latest.json
        if: env.HAS_UPDATER_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/updater-manifest.mjs "$TAG"

  checksums:
    name: Publish SHA-256 checksums
    # After every artifact is attached, including the .rpm files that arrive
    # via their own job. Checksums covering only some downloads are worse than
    # none: a user who finds SHA256SUMS.txt reasonably assumes it is complete.
    needs: [build, attach-rpms]
    runs-on: ubuntu-latest
    steps:
      - name: Checksum every asset on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist

          # Downloads from the release rather than the build artifacts, so the
          # checksums describe exactly what a user gets. An artifact and its
          # uploaded copy should be identical, but "should be" is not what a
          # checksum is for.
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --clobber

          # A previous run's checksum file would otherwise be hashed into the
          # new one. latest.json is left out too: it is not a download, and the
          # updater-manifest job runs alongside this one, so whether it had
          # arrived yet would change the file from run to run.
          rm -f SHA256SUMS.txt latest.json

          count=$(ls -1 | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No assets found on $TAG -- refusing to publish an empty checksum file."
            exit 1
          fi

          sha256sum * > SHA256SUMS.txt
          echo "Checksummed $count assets:"
          cat SHA256SUMS.txt

          gh release upload "$TAG" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
