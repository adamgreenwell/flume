name: Release

# Tagging v* builds installers for every supported platform and attaches them
# to a draft GitHub Release. Draft rather than published: artifacts should be
# smoke-tested on each OS before anyone downloads them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Shared by both build steps below, so they cannot drift apart.
  RELEASE_BODY: |
    Download the file for your platform below.

    Builds are unsigned unless signing credentials were configured. See the
    wiki's Signing & Distribution page for what your OS will say about that
    and the least alarming way past it.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      # The `secrets` context is not available in a step-level `if`, so the
      # presence check is hoisted to a job-level env var and tested from there.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      # One platform failing should not discard artifacts that already built:
      # a partial release is still useful, and re-running one leg is cheap.
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two single-architecture builds.
          # macOS runners bill at 10x and were roughly two thirds of a release
          # run's cost; collapsing two jobs into one removes a whole job's
          # checkout, npm ci, and toolchain setup at that multiplier.
          #
          # Users also get one download instead of having to know which Mac
          # they own. The .dmg is about twice the size (17 MB rather than 9),
          # which is a fair trade for a desktop app.
          #
          # --bundles dmg suppresses the .app.tar.gz updater artifact, which is
          # meaningless without an updater and only pads the download list.
          - name: macOS (universal)
            runner: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin --bundles dmg"
          - name: Windows (x64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # GitHub's arm64 Windows runner. Native rather than cross-compiled:
          # Tauri's Windows bundlers (WiX and NSIS) expect to run on the target
          # architecture, so cross-building produces a binary with no installer.
          - name: Windows (arm64)
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: ""
          # ubuntu-22.04 deliberately: it is the oldest supported base and so
          # sets the glibc and WebKitGTK floor for the .deb. Building on a
          # newer runner produces a package that will not install on Debian 12.
          # arm64 Linux builds natively on GitHub's arm64 runner. Cross-
          # compiling would need an aarch64 sysroot with WebKitGTK in it, which
          # is far more fragile than using the right machine.
          - name: Linux arm64 (.deb / AppImage)
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--bundles deb,appimage"
          - name: Linux (.deb / AppImage)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # Restricted explicitly. Left unrestricted the bundler also emits
            # an .rpm here, but one built on Ubuntu carries Debian-derived
            # dependency metadata, so it is not the package a Fedora or RHEL
            # user should install. The dedicated Fedora job below produces the
            # real one; without this the two race to attach the same filename.
            args: "--bundles deb,appimage"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          # Tauri v2's documented Linux prerequisites, plus two the docs omit.
          # libayatana-* is the current name; libappindicator3-dev is only a
          # transitional package, and it is what the tray needs on Linux.
          # patchelf is required by the AppImage bundler.
          #
          # xdg-utils provides xdg-mime, which the AppImage bundler shells out
          # to. It is preinstalled on the x86_64 runner image but *not* on the
          # arm64 one, so the arm64 leg failed with:
          #   failed to bundle project: xdg-mime binary not found
          # desktop-file-utils is installed alongside it for the same reason --
          # linuxdeploy validates .desktop files, and the arm64 image cannot be
          # assumed to carry the same tools as the x86_64 one.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            xdg-utils \
            desktop-file-utils

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin is not a real rustup target -- it is a lipo
          # of two builds -- so the two underlying targets must be installed
          # for that leg instead.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      # Deliberately no Rust build cache on release runs. A cached target
      # directory built with different features is exactly the state that
      # triggers the proc-macro resolution failure in #22, and a release build
      # is not worth risking for a few minutes of compile time.
      - run: npm ci

      # Two steps rather than one, because passing empty APPLE_* variables is
      # not the same as passing none. tauri-action treats the presence of
      # APPLE_CERTIFICATE as a request to sign and then fails importing an
      # empty certificate:
      #
      #   security: SecKeychainItemImport: ...parameters...were not valid
      #   failed codesign application: failed to import keychain certificate
      #
      # The application itself builds fine; only bundling fails. So when no
      # certificate is configured the variables must be absent entirely, which
      # is exactly the local unsigned build that works.
      - name: Build and bundle (signed)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Flume __VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Build and bundle (unsigned)
        if: env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Flume __VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  rpm:
    name: Linux ${{ matrix.arch }} (.rpm)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # Built in a Fedora container rather than on the runner: .rpm packaging
    # needs rpmbuild and Fedora's webkit2gtk4.1, neither of which exist on the
    # Ubuntu image.
    container:
      image: fedora:40
    steps:
      # No nodejs here: Fedora 40 ships Node 20, which is below the floor in
      # `engines`, so `npm ci` fails with EBADENGINE. setup-node below supplies
      # the right one and takes precedence on PATH.
      - name: Install build dependencies
        run: |
          dnf install -y \
            webkit2gtk4.1-devel openssl-devel curl wget file \
            libappindicator-gtk3-devel librsvg2-devel \
            gcc gcc-c++ make rpm-build git xz

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The container's own Node is too old. This is the same .nvmrc every
      # other job reads, so there is still one source of truth.
      #
      # No `cache: npm` unlike elsewhere: the cache action needs a resolvable
      # runner path, and this job's filesystem is the container's.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - run: node --version && npm ci

      - name: Build the frontend
        run: npm run build

      - name: Bundle the .rpm
        working-directory: src-tauri
        run: cargo install tauri-cli --version "^2" --locked && cargo tauri build --bundles rpm

      # Kept for dispatch runs that build no release, and as a fallback if the
      # release upload below fails.
      - name: Upload the .rpm as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: flume-rpm-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  attach-rpms:
    name: Attach .rpm files to the release
    needs: rpm
    runs-on: ubuntu-latest
    steps:
      # The .rpm jobs run inside a Fedora container, which has no GitHub CLI --
      # `gh: command not found` is how rc.2 failed. Rather than install one more
      # package into the container, the upload happens here, on a normal runner
      # where gh is preinstalled. It also handles both architectures in one
      # place instead of duplicating the step per matrix leg.
      - uses: actions/download-artifact@v8
        with:
          pattern: flume-rpm-*
          merge-multiple: true
          path: rpms

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la rpms/
          # --clobber so a re-run replaces assets rather than failing on a name
          # collision.
          gh release upload "$TAG" rpms/*.rpm --clobber -R "$GITHUB_REPOSITORY"

  notify-site:
    name: Rebuild the website
    needs: [build, rpm, attach-rpms]
    runs-on: ubuntu-latest
    # `always()` so a partial release still refreshes the site -- if Windows
    # succeeded and Linux did not, the download page should still gain the
    # Windows installers rather than staying a release behind.
    if: always()
    steps:
      # The site reads the GitHub releases API at build time, so its download
      # buttons render real filenames and sizes into static HTML and work with
      # JavaScript disabled. The cost of that choice is that a new release is
      # invisible until the site rebuilds, which is what this does.
      #
      # Skipped silently when no hook is configured: a fork has no Sevalla
      # deployment, and failing a release over it would be absurd.
      - name: Ping the Sevalla deploy hook
        env:
          HOOK: ${{ secrets.SEVALLA_DEPLOY_HOOK }}
        run: |
          set -uo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "No SEVALLA_DEPLOY_HOOK configured; skipping site rebuild."
            echo "The site will show this release after its next deploy."
            exit 0
          fi
          code=$(curl -sS -X POST -o /dev/null -w "%{http_code}" --max-time 30 "$HOOK")
          echo "Deploy hook responded $code"
          # Reported, not fatal. The release itself succeeded; a stale website
          # is worth a warning and not worth failing a green release over.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::warning::Site rebuild was not triggered (HTTP $code). Deploy the site manually."
          fi
